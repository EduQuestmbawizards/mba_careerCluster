<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBAWizards UniCompass Graduate Intelligence</title>

<style>
    html, body {
        overflow-y: auto;
    }

    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);

        display: flex;
        flex-direction: column;

        min-height: 100vh;   
    }

    h1 {
        text-align: center;
        color: white;
        margin: 20px 0 10px;
    }

    
    #output {
        flex: 1;
        padding: 20px;
        display: flex;
        justify-content: center;
        margin-bottom: 80px;
    }

    /* 🔥 FIXED CARD */
    .card {
        width: 100%;
        max-width: 650px;
        background: white;
        border-radius: 16px;
        padding: 25px 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        line-height: 1.7;
        margin: 0 auto;

        display: block;
        overflow: hidden;   /* 👈 FIX */
    }
    .card * {
        max-width: 100%;
    }

    .card h2, .card h3 {
        margin-top: 18px;
        color: #222;
    }

    .card p {
        margin: 8px 0;
    }

    .card ul {
        margin: 8px 0 8px 20px;
    }

    /* 🔥 LOADING */
    .spinner {
        display: none;
        margin: 20px auto;
        border: 4px solid #eee;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 35px;
        height: 35px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        100% { transform: rotate(360deg); }
    }

    /* 🔥 MODERN FOOTER */
    .input-bar {
        position: sticky;
        bottom: 0;
        background: #8356f6;
        backdrop-filter: blur(10px);
        padding: 12px;
        display: flex;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 -5px 20px rgba(0,0,0,0.15);
    }

    /* 🔥 SMALL INPUT */
    input {
        width: 60%;
        max-width: 400px;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #b89a9a;
        font-size: 14px;
    }

    /* 🔥 BUTTON */
    button {
        padding: 12px 16px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: rgb(255, 255, 255);
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        opacity: 0.9;
    }
</style>
</head>

<body>

<h1>🚀 MBAWizards UniCompass Graduate Intelligence</h1>

<div id="output"></div>

</body>
</html>
