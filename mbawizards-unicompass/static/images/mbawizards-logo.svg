<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient for Cap and Text -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C05B" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA8222" />
      <stop offset="100%" stop-color="#8B6914" />
    </linearGradient>

    <!-- Metallic Gold for Main Brand Name -->
    <linearGradient id="textGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#9E7D3B" />
      <stop offset="100%" stop-color="#7B5E23" />
    </linearGradient>
  </defs>

  <!-- Graduation Cap Icon -->
  <g transform="translate(570, 20) scale(0.95)">
    <!-- Top Cap Diamond -->
    <polygon points="100,10 185,52 100,94 15,52" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="2"/>
    <polygon points="100,24 165,52 100,80 35,52" fill="#E6C665" opacity="0.6"/>

    <!-- Skull Cap Base Underneath -->
    <path d="M 50,68 L 50,102 Q 100,128 150,102 L 150,68 Q 100,92 50,68 Z" fill="url(#goldGrad)" stroke="#8B6914" stroke-width="1.5"/>

    <!-- Tassel String and Hanging Bead -->
    <path d="M 100,52 Q 62,65 55,105" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="53" cy="115" r="9" fill="url(#goldGrad)"/>
    <!-- Button on Top -->
    <ellipse cx="100" cy="52" rx="6" ry="4" fill="#6B4F12"/>
  </g>

  <!-- Brand Name: MBA WIZARDS -->
  <text x="400" y="215" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Trajan Pro', 'Baskerville', 'Times New Roman', serif" 
        font-size="64" 
        font-weight="600" 
        letter-spacing="9" 
        fill="url(#textGold)">
    MBA WIZARDS
  </text>

  <!-- Tagline: Aspire. Advance. Achieve. -->
  <text x="400" y="275" 
        text-anchor="middle" 
        font-family="'Segoe UI', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="28" 
        font-weight="400" 
        letter-spacing="2.5" 
        fill="#05164d">
    Aspire. Advance. Achieve.
  </text>
</svg>
